<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculdade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes do React carregar, para a tela não piscar no tema errado
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("tema");
        } catch (e) {}
        if (!tema) {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        }
        if (tema === "escuro") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
